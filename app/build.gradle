plugins { id 'com.android.application' }
android {
    namespace 'cz.aevonyr.romance'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.aevonyr.romance'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}
