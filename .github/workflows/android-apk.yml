name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'public/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package web app into Android assets
        run: |
          set -eux
          test -s public/index.html
          test -s public/app.js
          mkdir -p app/src/main/assets
          cp public/index.html public/app.js public/offline.js public/scene.js app/src/main/assets/
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.js
          test -s app/src/main/assets/offline.js
          test -s app/src/main/assets/scene.js

      - name: Compile debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee gradle-build.log || {
            echo '========== BUILD ERRORS =========='
            grep -n -E -C 5 '(^e: |error:|FAILURE:|What went wrong:|Could not |Execution failed|cannot find symbol|No matching variant)' gradle-build.log | head -160 || true
            exit 1
          }

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aevonyr-Romance-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
